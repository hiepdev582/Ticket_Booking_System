services:
  # =========================================================================
  # 1. PRIMARY DATABASE (PostgreSQL)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ticket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticket_network

  # =========================================================================
  # 2. IN-MEMORY CACHE & DISTRIBUTED LOCK (Redis)
  # =========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: ticket_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ticket_network

  # =========================================================================
  # 3. EVENT STREAMING BROKER (Apache Kafka - KRaft Mode)
  # =========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ticket_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ticket_network

  # =========================================================================
  # 4. KAFKA MANAGEMENT DASHBOARD (Kafka-UI)
  # =========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ticket_kafka_ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ticket-kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ticket_network

  # =========================================================================
  # 5. S3-COMPATIBLE OBJECT STORAGE (MinIO)
  # =========================================================================
  minio:
    image: minio/minio:latest
    container_name: ticket_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticket_network

  minio-init:
    image: minio/mc:latest
    container_name: ticket_minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/bucket-tickets;
      mc anonymous set download local/bucket-tickets;
      echo 'MinIO bucket-tickets successfully initialized!';
      exit 0;
      "
    networks:
      - ticket_network

  # =========================================================================
  # 6. DISTRIBUTED TRACING & OBSERVABILITY (Jaeger + OpenTelemetry)
  # =========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: ticket_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    networks:
      - ticket_network

  # =========================================================================
  # 7. METRICS & MONITORING (Prometheus & Grafana)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ticket_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ticket_network

  grafana:
    image: grafana/grafana:latest
    container_name: ticket_grafana
    restart: unless-stopped
    ports:
      - "3001:3000" # Host 3001 để nhường port 3000 cho Nuxt 3
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ticket_network

# =========================================================================
# NETWORKS & PERSISTENT VOLUMES
# =========================================================================
networks:
  ticket_network:
    name: ticket_booking_network
    driver: bridge

volumes:
  postgres_data:
    name: ticket_postgres_data
  redis_data:
    name: ticket_redis_data
  kafka_data:
    name: ticket_kafka_data
  minio_data:
    name: ticket_minio_data
  prometheus_data:
    name: ticket_prometheus_data
  grafana_data:
    name: ticket_grafana_data
